[package]
name = "rogue-overlay"
version = "0.1.0"
edition = "2021"
description = "Overlay de maná, cooldowns y ore timer para Rogue Lineage (Roblox)"
repository = "https://github.com/abrahampo1/rogue_overlay"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = "0.11"
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "gif", "jpeg", "webp"] }
eframe = "0.31"
rfd = "0.15"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_System_LibraryLoader",
    "Win32_Media_Audio",
    "Win32_System_Threading",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
